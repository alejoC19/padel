name: CI

# Corre en cada push y PR. El merge se bloquea si algo acá falla
# (configurar branch protection en GitHub → Settings → Branches).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ==========================================================================
  # BACKEND — typecheck + unit + integración (con Postgres real)
  # ==========================================================================
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clubos

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clubos_owner
          POSTGRES_PASSWORD: clubos_test
          POSTGRES_DB: clubos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubos_owner -d clubos_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://clubos_owner:clubos_test@localhost:5432/clubos_test
      DATABASE_URL_TEST: postgresql://clubos_owner:clubos_test@localhost:5432/clubos_test
      PAYMENTS_ENC_KEY: clave-de-test-de-al-menos-treinta-y-dos-chars
      JWT_ACCESS_SECRET: test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clubos/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar extensiones y rol de la base
        run: |
          PGPASSWORD=clubos_test psql -h localhost -U clubos_owner -d clubos_test -f db/init/01-extensions.sql
          PGPASSWORD=clubos_test psql -h localhost -U clubos_owner -d clubos_test -f db/init/02-app-role.sql

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Aplicar schema + RLS
        run: |
          npx prisma migrate deploy
          PGPASSWORD=clubos_test psql -h localhost -U clubos_owner -d clubos_test \
            -f prisma/migrations/manual/001_integrity_and_rls.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitarios
        run: npm run test:unit

      - name: Tests de integración (RLS, multi-tenant)
        run: npm run test:int

  # ==========================================================================
  # FRONTEND — typecheck + E2E (Playwright)
  # ==========================================================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clubos-next

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clubos-next/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Los E2E que dependen de la API se corren en un job de integración
      # aparte (pendiente): acá se valida build + los E2E que no requieren
      # backend. Cuando esté el compose de test full-stack, habilitar:
      # - name: E2E
      #   run: npm run test:e2e

  # ==========================================================================
  # Gate final: todos los jobs deben pasar
  # ==========================================================================
  ci-ok:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - run: echo "Todos los checks pasaron."
