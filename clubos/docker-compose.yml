services:
  db:
    image: postgres:16-alpine
    container_name: clubos-db
    environment:
      POSTGRES_USER: clubos_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clubos_dev}
      POSTGRES_DB: clubos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubos_owner -d clubos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clubos-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
